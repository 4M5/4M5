<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500&amp;display=swap');
      .display { font-family: 'Space Grotesk', Helvetica, Arial, sans-serif; }
      .mono    { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
      .body    { font-family: 'Inter', Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101219"/>
      <stop offset="100%" stop-color="#0B0C11"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#07070A"/>

  <!-- outer console frame -->
  <rect x="40" y="20" width="1120" height="260" rx="16" fill="url(#panel)" stroke="#1C1E26"/>

  <!-- title bar -->
  <text x="70" y="55" class="mono" font-size="12" letter-spacing="3" fill="#8A8D98">MISSION CONTROL</text>
  <g transform="translate(1080,42)">
    <circle r="4" fill="#5FE39A">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="4" class="mono" font-size="12" fill="#5FE39A">ONLINE</text>
  </g>
  <line x1="70" y1="72" x2="1130" y2="72" stroke="#1C1E26"/>

  <!-- four tiles -->
  <g class="body">
    <!-- tile 1: status -->
    <rect x="70" y="96" width="255" height="160" rx="12" fill="#0E0F13" stroke="#1C1E26"/>
    <text x="92" y="126" class="mono" font-size="11" letter-spacing="2" fill="#6C8EFF">STATUS</text>
    <text x="92" y="160" class="display" font-size="22" fill="#F2F3F5">Available</text>
    <text x="92" y="184" font-size="13" fill="#8A8D98">Open to AI opportunities</text>

    <!-- tile 2: education -->
    <rect x="345" y="96" width="255" height="160" rx="12" fill="#0E0F13" stroke="#1C1E26"/>
    <text x="367" y="126" class="mono" font-size="11" letter-spacing="2" fill="#6C8EFF">EDUCATION</text>
    <text x="367" y="158" class="display" font-size="19" fill="#F2F3F5">M.Tech</text>
    <text x="367" y="182" font-size="13" fill="#8A8D98">Artificial Intelligence</text>

    <!-- tile 3: current focus -->
    <rect x="620" y="96" width="255" height="160" rx="12" fill="#0E0F13" stroke="#1C1E26"/>
    <text x="642" y="126" class="mono" font-size="11" letter-spacing="2" fill="#6C8EFF">CURRENT FOCUS</text>
    <g class="mono" font-size="12" fill="#C9CBD3">
      <rect x="642" y="140" width="118" height="24" rx="12" fill="#15171F" stroke="#242733"/>
      <text x="701" y="156" text-anchor="middle">Machine Learning</text>
      <rect x="642" y="172" width="118" height="24" rx="12" fill="#15171F" stroke="#242733"/>
      <text x="701" y="188" text-anchor="middle">Computer Vision</text>
      <rect x="768" y="140" width="80" height="24" rx="12" fill="#15171F" stroke="#242733"/>
      <text x="808" y="156" text-anchor="middle">Python</text>
      <rect x="768" y="172" width="80" height="24" rx="12" fill="#15171F" stroke="#242733"/>
      <text x="808" y="188" text-anchor="middle">Deep Lrn</text>
    </g>

    <!-- tile 4: uptime-style counter -->
    <rect x="895" y="96" width="235" height="160" rx="12" fill="#0E0F13" stroke="#1C1E26"/>
    <text x="917" y="126" class="mono" font-size="11" letter-spacing="2" fill="#6C8EFF">SYSTEM</text>
    <text x="917" y="160" class="display" font-size="19" fill="#F2F3F5">Learning</text>
    <text x="917" y="184" font-size="13" fill="#8A8D98">continuous process</text>
  </g>
</svg>
