<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap');
      .display { font-family: 'Space Grotesk', Helvetica, Arial, sans-serif; }
      .mono    { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    </style>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C8EFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6C8EFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C8EFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="#07070A"/>
  <text x="600" y="46" text-anchor="middle" class="mono" font-size="12" letter-spacing="3" fill="#8A8D98">DISCIPLINE MAP</text>

  <!-- edges: center (600,250) to 6 nodes -->
  <g stroke="url(#edge)" stroke-width="1.4" fill="none">
    <line x1="600" y1="250" x2="330" y2="130" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="250" x2="870" y2="130" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="2.6s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="250" x2="230" y2="270" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="250" x2="970" y2="270" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="2.8s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="250" x2="380" y2="400" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="2.3s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="250" x2="820" y2="400" stroke-dasharray="6 5">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="2.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- center node -->
  <circle cx="600" cy="250" r="60" fill="url(#coreGlow)"/>
  <circle cx="600" cy="250" r="34" fill="#0E0F13" stroke="#6C8EFF" stroke-width="1.5"/>
  <text x="600" y="257" text-anchor="middle" class="display" font-size="18" font-weight="700" fill="#F2F3F5">ADIL</text>

  <!-- 6 discipline nodes -->
  <g class="display" font-size="14" fill="#F2F3F5">
    <g transform="translate(330,130)">
      <circle r="46" fill="#0E0F13" stroke="#242733"/>
      <circle r="46" fill="none" stroke="#6C8EFF" stroke-opacity="0.5">
        <animate attributeName="r" values="40;48;40" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="5">ML</text>
    </g>
    <text x="330" y="188" text-anchor="middle" class="mono" font-size="11" fill="#8A8D98">Machine Learning</text>

    <g transform="translate(870,130)">
      <circle r="46" fill="#0E0F13" stroke="#242733"/>
      <circle r="46" fill="none" stroke="#A78BFA" stroke-opacity="0.5">
        <animate attributeName="r" values="40;48;40" dur="3.8s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="5">CV</text>
    </g>
    <text x="870" y="188" text-anchor="middle" class="mono" font-size="11" fill="#8A8D98">Computer Vision</text>

    <g transform="translate(230,270)">
      <circle r="42" fill="#0E0F13" stroke="#242733"/>
      <circle r="42" fill="none" stroke="#6C8EFF" stroke-opacity="0.5">
        <animate attributeName="r" values="36;44;36" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="5" font-size="12">DL</text>
    </g>
    <text x="230" y="322" text-anchor="middle" class="mono" font-size="11" fill="#8A8D98">Deep Learning</text>

    <g transform="translate(970,270)">
      <circle r="42" fill="#0E0F13" stroke="#242733"/>
      <circle r="42" fill="none" stroke="#A78BFA" stroke-opacity="0.5">
        <animate attributeName="r" values="36;44;36" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="5" font-size="12">PY</text>
    </g>
    <text x="970" y="322" text-anchor="middle" class="mono" font-size="11" fill="#8A8D98">Python</text>

    <g transform="translate(380,400)">
      <circle r="42" fill="#0E0F13" stroke="#242733"/>
      <circle r="42" fill="none" stroke="#6C8EFF" stroke-opacity="0.5">
        <animate attributeName="r" values="36;44;36" dur="3.5s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="5" font-size="11">SOLVE</text>
    </g>
    <text x="380" y="452" text-anchor="middle" class="mono" font-size="11" fill="#8A8D98">Problem Solving</text>

    <g transform="translate(820,400)">
      <circle r="42" fill="#0E0F13" stroke="#242733"/>
      <circle r="42" fill="none" stroke="#A78BFA" stroke-opacity="0.5">
        <animate attributeName="r" values="36;44;36" dur="3.3s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="5" font-size="11">OSS</text>
    </g>
    <text x="820" y="452" text-anchor="middle" class="mono" font-size="11" fill="#8A8D98">Open Source</text>
  </g>
</svg>
