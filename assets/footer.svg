<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    </style>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C8EFF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="fglow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6C8EFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#07070A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="220" fill="#07070A"/>
  <rect width="1200" height="220" fill="url(#fglow)"/>

  <g class="mono" font-size="18" text-anchor="middle" fill="#C9CBD3">
    <text x="600" y="80">while (true) {</text>
    <text x="600" y="112" fill="url(#fg)">Learn();  Build();  Improve();</text>
    <text x="600" y="144">}</text>
  </g>
  <rect x="1" y="185" width="1198" height="1" fill="#1C1E26"/>
  <text x="600" y="205" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#565A66">ADIL — ARTIFICIAL INTELLIGENCE ENGINEER</text>
</svg>
